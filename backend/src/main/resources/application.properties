spring.application.name=pantrychef-backend

# Local settings come from the repo-root .env (see .env.example) or real environment variables.
spring.config.import=optional:file:../.env[.properties]
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Auth (D-008, A-07). The signing secret has no default: startup fails without it.
pantrychef.jwt.secret=${JWT_SIGNING_SECRET}
pantrychef.jwt.issuer=${JWT_ISSUER:pantrychef-local}
pantrychef.jwt.ttl=PT60M

logging.pattern.level=%5p [%X{requestId:-}]
