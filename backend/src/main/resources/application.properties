spring.application.name=pantrychef-backend

# Local settings come from the repo-root .env (see .env.example) or real environment variables.
spring.config.import=optional:file:../.env[.properties]
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Auth (D-008, A-07). The signing secret has no default: startup fails without it.
pantrychef.jwt.secret=${JWT_SIGNING_SECRET}
pantrychef.jwt.issuer=${JWT_ISSUER:pantrychef-local}
pantrychef.jwt.ttl=PT60M

logging.pattern.level=%5p [%X{requestId:-}]

# App-wide settings (A-01, A-03): calendar dates for expiry use this zone; new pantry prices use this currency.
pantrychef.timezone=${APP_TIMEZONE:Asia/Kolkata}
pantrychef.currency=${APP_CURRENCY:INR}

# AI service (D-009). Without a token of at least 32 characters, suggestions answer 503 and the rest still works.
pantrychef.ai.base-url=${FASTAPI_BASE_URL:http://localhost:8000}
pantrychef.ai.service-token=${SERVICE_TO_SERVICE_SECRET:}
pantrychef.ai.connect-timeout=PT2S
pantrychef.ai.read-timeout=PT15S
